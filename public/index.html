    /* ========================= Markdownリンクの簡易パーサー ========================= */
    function renderWithLinks(text) {
      const parts = [];
      let lastIndex = 0;
      const regex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
      let match;
      let key = 0;
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push(text.slice(lastIndex, match.index));
        }
        parts.push(
          <a
            key={"link-" + key++}
            href={match[2]}
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: COLORS.accent, fontWeight: "600", textDecoration: "underline" }}
          >
            {match[1]}
          </a>
        );
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        parts.push(text.slice(lastIndex));
      }
      return parts;
    }

    /* ========================= 営業時間外判定 ========================= */
    function isWithinBusinessHours() {
      const now = new Date();
      const day = now.getDay(); // 0=日 ... 2=火
      const hour = now.getHours() + now.getMinutes() / 60;
      if (day === 2) return false; // 火曜定休（第3月曜は簡易判定のため除外）
      return hour >= 9 && hour < 18.5;
    }

    /* ========================= メインアプリ ========================= */
    function ChatbotApp() {
      const [guestName, setGuestName] = useState("");
      const [nameInput, setNameInput] = useState("");
      const [showForm, setShowForm] = useState(true);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [turnCount, setTurnCount] = useState(0);
      const [askedQuestions, setAskedQuestions] = useState(() => new Set());
      const messagesEndRef = useRef(null);
      const lastMessageRef = useRef(null);
      const sessionIdRef = useRef(crypto.randomUUID());

      const visibleQuickQuestions = QUICK_QUESTIONS.filter(
        (q) => !askedQuestions.has(q)
      ).slice(0, 6);

      useEffect(() => {
        const setViewportHeight = () => {
          const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.setProperty("--vh", `${h * 0.01}px`);
        };
        setViewportHeight();
        window.addEventListener("resize", setViewportHeight);
        window.addEventListener("orientationchange", setViewportHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setViewportHeight);
        }
        return () => {
          window.removeEventListener("resize", setViewportHeight);
          window.removeEventListener("orientationchange", setViewportHeight);
          if (window.visualViewport) {
            window.visualViewport.removeEventListener("resize", setViewportHeight);
          }
        };
      }, []);

      useEffect(() => {
        if (isLoading) {
          if (messagesEndRef.current) {
            messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
          }
        } else if (lastMessageRef.current) {
          lastMessageRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, [messages, isLoading]);

      const handleStart = () => {
        const name = nameInput.trim();
        setGuestName(name);
        const withinHours = isWithinBusinessHours();
        const greeting = withinHours
          ? (name
              ? `${name}様、はじめまして😊✨\n美容室レプレです！\nご予約前のご相談など、お気軽にお聞かせくださいね🙌`
              : `はじめまして😊✨\n美容室レプレです！\nご予約前のご相談など、お気軽にお聞かせくださいね🙌`)
          : SALON.offHoursMessage;
        setMessages([{ role: "assistant", content: greeting }]);
        setShowForm(false);
      };

      const sendMessage = async (text) => {
        if (!text.trim() || isLoading) return;
        const newMessages = [...messages, { role: "user", content: text }];
        setMessages(newMessages);
        setInput("");

        if (QUICK_QUESTIONS.includes(text)) {
          setAskedQuestions((prev) => {
            const next = new Set(prev);
            next.add(text);
            return next;
          });
        }

        if (turnCount >= MAX_TURNS) {
          setMessages([
            ...newMessages,
            {
              role: "assistant",
              content:
                "たくさんご相談いただきありがとうございます😊\nより詳しいご案内はお電話（0282-51-1879）または公式LINEにて、スタッフが直接対応させていただきますね。",
            },
          ]);
          return;
        }

        setIsLoading(true);
        setTurnCount((c) => c + 1);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-haiku-4-5-20251001",
              max_tokens: 500,
              system: SYSTEM_PROMPT,
              messages: newMessages.map((m) => ({ role: m.role, content: m.content })),
            }),
          });
          const data = await response.json();
          const replyText =
            data && data.content && data.content[0] && data.content[0].text
              ? data.content[0].text
              : "申し訳ございません、うまくお答えできませんでした。お電話（0282-51-1879）にてお問い合わせくださいませ🙏";
          setMessages((prev) => [...prev, { role: "assistant", content: replyText }]);

          // Notionへの相談ログ自動保存（送りっぱなし。失敗してもチャット表示には影響しない）
          fetch("/api/log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: sessionIdRef.current,
              userMessage: text,
              assistantMessage: replyText,
            }),
          }).catch(() => {});
        } catch (error) {
          setMessages((prev) => [
            ...prev,
            {
              role: "assistant",
              content:
                "申し訳ございません、只今接続がうまくいかないようです🙏\nお手数ですがお電話（0282-51-1879）にてお問い合わせください。",
            },
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div style={styles.wrapper}>
          <div style={styles.container}>
            {showForm ? (
              <NameForm nameInput={nameInput} setNameInput={setNameInput} handleStart={handleStart} />
            ) : (
              <ChatView
                messages={messages}
                input={input}
                setInput={setInput}
                sendMessage={sendMessage}
                isLoading={isLoading}
                messagesEndRef={messagesEndRef}
                lastMessageRef={lastMessageRef}
                showQuick={true}
                quickQuestions={visibleQuickQuestions}
              />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ChatbotApp />);
  </script>
</body>
</html>
